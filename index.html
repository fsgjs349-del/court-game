<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Зал Суда</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: #050505; color: #fff; font-family: 'Unbounded', sans-serif; margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .content { flex: 1; display: flex; flex-direction: column; padding: 15px; padding-bottom: 90px; overflow-y: auto; }
        .screen { display: none; flex-direction: column; height: 100%; }
        .screen.active { display: flex; }

        .main-menu { align-items: center; justify-content: center; text-align: center; height: 100%; display: flex; flex-direction: column; }
        .main-title { font-size: 28px; font-weight: 900; color: #ffd700; text-transform: uppercase; margin-bottom: 10px; }
        .main-subtitle { font-size: 12px; color: #888; margin-bottom: 20px; }
        
        .snake-container { background: rgba(0,0,0,0.5); border-radius: 20px; padding: 10px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; }
        canvas#snake-game { background: #0d0d12; border-radius: 10px; width: 250px; height: 250px; touch-action: none; }
        .snake-score { font-size: 14px; font-weight: bold; color: #00ffcc; margin-bottom: 10px; }

        .music-btn-small { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.1); border: 1px solid #444; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; color: white; }
        .music-btn-small.active { background: #ffd700; color: #000; border-color: #ffd700; }

        .lobby-box { text-align: center; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: center; }
        .lobby-title { color: #fff; font-size: 20px; font-weight: 800; text-transform: uppercase; margin-bottom: 15px; }
        .lobby-timer { font-size: 40px; font-weight: 900; color: #00ffcc; margin: 10px 0; }
        .player-card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 20px; text-align: center; border: 1px solid #ffd700; width: 150px; margin-bottom: 20px; }
        .avatar { width: 60px; height: 60px; margin: 0 auto 10px auto; border-radius: 18px; background: #1a1a24; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        .role { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .name { font-size: 16px; font-weight: bold; color: #ffd700; }
        
        .invite-box { display: flex; gap: 10px; width: 100%; max-width: 350px; margin-top: 10px; }
        .invite-link { flex: 1; background: #1a1a24; padding: 12px; border-radius: 12px; border: 1px dashed #ffd700; font-size: 11px; color: #ffd700; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .copy-btn { background: #ffd700; color: #000; border: none; border-radius: 12px; padding: 0 15px; font-weight: bold; cursor: pointer; }
        .wait-text { margin-top: 15px; color: #888; font-size: 12px; }

        .chat-screen { display: none; flex-direction: column; height: 100%; }
        .chat-screen.active { display: flex; }
        .chat-header { text-align: center; font-size: 14px; color: #ffd700; margin-bottom: 10px; font-weight: bold; }
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px; }
        .message-bubble { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 12px; }
        .message-bubble.right { align-self: flex-end; background: #ffd700; color: #000; }
        .message-system { align-self: center; text-align: center; font-size: 10px; color: #888; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 10px; }
        
        .chat-input-area { display: flex; gap: 8px; margin-top: 10px; }
        .chat-input-area input { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid #333; background: #1a1a24; color: #fff; font-family: 'Unbounded', sans-serif; font-size: 12px; outline: none; }
        .chat-input-area button { width: 50px; border-radius: 12px; background: #ffd700; color: #000; font-size: 18px; border: none; cursor: pointer; }

        .info-box { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); line-height: 1.6; font-size: 12px; color: #bbb; margin-top: 20px; }
        .creator-btn { display: inline-block; margin-top: 15px; padding: 12px 20px; background: #1a1a24; border-radius: 12px; color: #ffd700; text-decoration: none; font-weight: 600; border: 1px solid #ffd700; }

        .top-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .top-item { display: flex; align-items: center; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .top-rank { font-size: 16px; font-weight: 900; color: #ffd700; width: 30px; }
        .top-avatar { font-size: 24px; margin-right: 15px; }
        .top-info { flex: 1; }
        .top-name { font-size: 14px; font-weight: bold; color: #fff; }
        .top-money { font-size: 11px; color: #00ffcc; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; background: rgba(5, 5, 5, 0.95); border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 10; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #555; font-size: 9px; cursor: pointer; width: 20%; text-transform: uppercase; }
        .nav-icon-wrap { width: 45px; height: 45px; border-radius: 50%; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; margin-bottom: 4px; border: 1px solid transparent; }
        .nav-icon { font-size: 20px; }
        .nav-item.active { color: #ffd700; }
        .nav-item.active .nav-icon-wrap { background: rgba(255, 215, 0, 0.15); border-color: #ffd700; }
        .center-play-btn { width: 65px; height: 65px; background: #ffd700; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #000; transform: translateY(-20px); border: 5px solid #050505; cursor: pointer; }

        .verdict-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: flex-end; z-index: 100; transform: translateY(100%); transition: transform 0.4s; }
        .verdict-overlay.active { transform: translateY(0); }
        .verdict-panel { background: #121218; width: 100%; border-top-left-radius: 30px; border-top-right-radius: 30px; padding: 25px; }
        .verdict-panel h3 { margin: 0 0 15px 0; color: #ffd700; font-size: 16px; text-align: center; }
        .verdict-panel textarea { width: 100%; height: 100px; padding: 15px; border-radius: 16px; border: 1px solid #333; background: #1a1a24; color: #fff; font-family: 'Unbounded', sans-serif; font-size: 12px; resize: none; outline: none; margin-bottom: 15px; }
        .verdict-btns { display: flex; gap: 10px; }
        .verdict-btns button { flex: 1; padding: 16px; border-radius: 16px; border: none; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 12px; color: #fff; cursor: pointer; }
        .btn-guilty { background: linear-gradient(135deg, #ff0f7b, #f89b29); }
        .btn-not { background: linear-gradient(135deg, #00c6ff, #0072ff); }

        .error-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px; text-align: center; }
        .error-overlay.active { display: flex; }
        .error-text { color: #ff4b2b; font-size: 16px; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="content">
        <!-- ГЛАВНОЕ МЕНЮ -->
        <div class="screen active" id="screen-main">
            <div class="main-menu">
                <button class="music-btn-small" id="music-btn" onclick="toggleMusic()">🎵</button>
                <div class="main-title">Зал Суда</div>
                <div class="main-subtitle">Создатель: @gupuyi</div>
                <div class="snake-container">
                    <div class="snake-score">Счет: <span id="score">0</span></div>
                    <canvas id="snake-game" width="250" height="250"></canvas>
                </div>
            </div>
        </div>

        <!-- ЛОББИ -->
        <div class="screen" id="screen-lobby">
            <div class="lobby-box">
                <div class="lobby-title">Лобби создано</div>
                <div class="lobby-timer" id="lobby-timer">03:00</div>
                <div class="player-card">
                    <div class="avatar" id="my-avatar">🙋‍♂️</div>
                    <div class="role" id="my-role">Ожидание</div>
                    <div class="name" id="my-name">Ты</div>
                </div>
                <div class="invite-box">
                    <div class="invite-link" id="lobby-link">Генерация...</div>
                    <button class="copy-btn" onclick="copyLink()">📋</button>
                </div>
                <div class="wait-text">Ожидание игроков (минимум 3)...</div>
            </div>
        </div>

        <!-- ЧАТ -->
        <div class="screen" id="screen-chat">
            <div class="chat-header" id="chat-header">Чат</div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Аргумент (5 слов)...">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>

        <!-- ИНФО -->
        <div class="screen" id="screen-info">
            <div class="main-title" style="text-align:center; margin-top:20px; font-size: 20px;">О Игре</div>
            <div class="info-box">
                <h3>Добро пожаловать в Суд!</h3>
                <p>Создатель игры: <a href="https://t.me/gupuyi" class="creator-btn">✈️ @gupuyi</a></p>
            </div>
        </div>

        <!-- ТОП -->
        <div class="screen" id="screen-top">
            <div class="main-title" style="text-align:center; margin-top:20px; font-size: 20px;">Топ-50</div>
            <div class="top-list" id="top-list"></div>
        </div>
    </div>

    <!-- ВЕРДИКТ -->
    <div class="verdict-overlay" id="verdict-overlay">
        <div class="verdict-panel">
            <h3>Вынесение вердикта</h3>
            <textarea id="verdict-text" placeholder="Напиши текст решения суда..."></textarea>
            <div class="verdict-btns">
                <button class="btn-guilty" onclick="sendVerdict('guilty')">✅ Виновен</button>
                <button class="btn-not" onclick="sendVerdict('not_guilty')">❌ Не виновен</button>
            </div>
        </div>
    </div>

    <!-- МЕНЮ -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('screen-main', this)"><div class="nav-icon-wrap"><div class="nav-icon">🏠</div></div><div>Главная</div></div>
        <div class="nav-item" onclick="switchTab('screen-chat', this)"><div class="nav-icon-wrap"><div class="nav-icon">💬</div></div><div>Чат</div></div>
        <div class="center-play-btn" onclick="createLobby()">🎮</div>
        <div class="nav-item" onclick="switchTab('screen-top', this)"><div class="nav-icon-wrap"><div class="nav-icon">🏆</div></div><div>Топ</div></div>
        <div class="nav-item" onclick="switchTab('screen-info', this)"><div class="nav-icon-wrap"><div class="nav-icon">ℹ️</div></div><div>Инфо</div></div>
    </div>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // --- МУЗЫКА ---
        let isMusicPlaying = false;
        let music = document.getElementById('bg-music');
        function toggleMusic() {
            let btn = document.getElementById('music-btn');
            if (isMusicPlaying) { music.pause(); btn.classList.remove('active'); } 
            else { music.play(); btn.classList.add('active'); }
            isMusicPlaying = !isMusicPlaying;
        }

        // --- КОПИРОВАНИЕ ---
        function copyLink() {
            let link = document.getElementById('lobby-link').innerText;
            let tempInput = document.createElement("input");
            tempInput.value = link;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            alert("Ссылка скопирована!");
        }

        // --- ЛОББИ ---
        let lobbyInterval;
        function createLobby() {
            switchTab('screen-lobby', document.querySelectorAll('.nav-item')[0]);
            document.getElementById('lobby-link').innerText = `https://t.me/courtrus_bot?start=join_${Math.floor(Math.random()*10000)}`;
            
            // Получаем ID и роль от бота
            let myId = tg.initDataUnsafe?.user?.id;
            let isJudge = (myId == 7414218922);
            let card = document.querySelector('.player-card');
            
            if (isJudge) {
                document.getElementById('my-avatar').innerText = "👑";
                document.getElementById('my-role').innerText = "Судья";
                document.querySelector('.lobby-title').innerText = "Вы — Судья 👑";
            } else {
                document.getElementById('my-avatar').innerText = "🙋‍♂️";
                document.getElementById('my-role').innerText = "Истец";
                document.querySelector('.lobby-title').innerText = "Лобби создано";
            }
            
            let lobbyTime = 180;
            clearInterval(lobbyInterval);
            lobbyInterval = setInterval(() => {
                lobbyTime--;
                let min = Math.floor(lobbyTime / 60);
                let sec = lobbyTime % 60;
                document.getElementById('lobby-timer').innerText = `0${min}:${sec < 10 ? '0'+sec : sec}`;
                if (lobbyTime <= 0) { 
                    clearInterval(lobbyInterval); 
                    if (!tg.initDataUnsafe?.user) document.getElementById('error-overlay').classList.add('active');
                }
            }, 1000);
        }

        // --- ЧАТ ---
        function addMessage(text, type) {
            let box = document.getElementById('chat-messages');
            let div = document.createElement('div');
            if (type === 'system') { div.className = 'message-system'; div.innerText = text; } 
            else { div.className = `message-bubble ${type === 'my' ? 'right' : 'left'}`; div.appendChild(document.createTextNode(text)); }
            box.appendChild(div); box.scrollTop = box.scrollHeight;
        }
        
        function sendMessage() {
            let input = document.getElementById('chat-input');
            let text = input.value.trim();
            if (text === '') return;
            let words = text.split(/\s+/).filter(word => word.length > 0);
            if (words.length < 5) { addMessage(`⚠️ Ошибка: минимум 5 слов!`, "system"); return; }
            
            addMessage(text, 'my'); 
            input.value = '';
            
            // Отправляем боту
            tg.sendData(JSON.stringify({ action: 'chat_message', text: text }));
        }

        // --- ВЕРДИКТ ---
        function showVerdictPanel() { document.getElementById('verdict-overlay').classList.add('active'); }
        function sendVerdict(type) {
            let text = document.getElementById('verdict-text').value;
            if (text.trim() === '') return alert('Напиши текст решения!');
            tg.sendData(JSON.stringify({ action: 'verdict', type: type, text: text }));
            document.getElementById('verdict-overlay').classList.remove('active');
            addMessage(`Решение суда: ${text}`, "my");
            addMessage(type === 'guilty' ? "✅ ВИНОВЕН" : "❌ НЕ ВИНОВЕН", "system");
        }

        // --- МЕНЮ ---
        function switchTab(screenId, element) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(element) element.classList.add('active');
        }

        // --- ЗМЕЙКА ---
        const snakeCanvas = document.getElementById('snake-game');
        const snakeCtx = snakeCanvas.getContext('2d');
        const gridSize = 10;
        let snake = [{x: 12, y: 12}, {x: 12, y: 13}, {x: 12, y: 14}];
        let food = {x: 15, y: 15};
        let dx = 0, dy = -1;
        let score = 0;
        let gameSpeed = 150;
        let snakeInterval;
        let isGameOver = false;

        function drawSnake() {
            snakeCtx.fillStyle = '#0d0d12'; snakeCtx.fillRect(0, 0, 250, 250);
            snakeCtx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            for(let i = 0; i <= 250; i += gridSize) { snakeCtx.beginPath(); snakeCtx.moveTo(i, 0); snakeCtx.lineTo(i, 250); snakeCtx.stroke(); snakeCtx.beginPath(); snakeCtx.moveTo(0, i); snakeCtx.lineTo(250, i); snakeCtx.stroke(); }
            snakeCtx.fillStyle = '#ff4b2b'; snakeCtx.shadowBlur = 10; snakeCtx.shadowColor = '#ff4b2b';
            snakeCtx.beginPath(); snakeCtx.arc(food.x * gridSize + 5, food.y * gridSize + 5, 4, 0, Math.PI * 2); snakeCtx.fill(); snakeCtx.shadowBlur = 0;
            snake.forEach((part, index) => {
                if (index === 0) { snakeCtx.fillStyle = '#ffd700'; snakeCtx.shadowBlur = 15; snakeCtx.shadowColor = '#ffd700'; } 
                else { let opacity = 1 - (index / snake.length) * 0.6; snakeCtx.fillStyle = `rgba(0, 255, 204, ${opacity})`; snakeCtx.shadowBlur = 5; snakeCtx.shadowColor = '#00ffcc'; }
                snakeCtx.beginPath(); snakeCtx.roundRect(part.x * gridSize + 1, part.y * gridSize + 1, 8, 8, 4); snakeCtx.fill();
            });
            snakeCtx.shadowBlur = 0;
            if (isGameOver) { snakeCtx.fillStyle = 'rgba(0,0,0,0.7)'; snakeCtx.fillRect(0, 0, 250, 250); snakeCtx.fillStyle = '#ff4b2b'; snakeCtx.font = 'bold 20px Unbounded'; snakeCtx.textAlign = 'center'; snakeCtx.fillText('GAME OVER', 125, 120); snakeCtx.fillStyle = '#fff'; snakeCtx.font = '12px Unbounded'; snakeCtx.fillText('Свайпни для рестарта', 125, 150); }
        }

        function moveSnake() {
            if (isGameOver) return;
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            if (head.x < 0 || head.x >= 25 || head.y < 0 || head.y >= 25) { isGameOver = true; drawSnake(); return; }
            for (let i = 0; i < snake.length; i++) { if (snake[i].x === head.x && snake[i].y === head.y) { isGameOver = true; drawSnake(); return; } }
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) { score += 10; document.getElementById('score').innerText = score; generateFood(); if (gameSpeed > 70) { clearInterval(snakeInterval); gameSpeed -= 5; snakeInterval = setInterval(moveSnake, gameSpeed); } } 
            else { snake.pop(); }
            drawSnake();
        }

        function generateFood() { let newFood; while (true) { newFood = { x: Math.floor(Math.random() * 24), y: Math.floor(Math.random() * 24) }; let isInsideSnake =
