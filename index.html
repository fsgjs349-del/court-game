<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Зал Суда</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: #050505; color: #fff; font-family: 'Unbounded', sans-serif; margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(255, 215, 0, 0.05) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(0, 255, 204, 0.05) 0%, transparent 40%);
        }
        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .content { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; padding: 15px; padding-bottom: 80px; overflow-y: auto; }
        
        /* ЭКРАН 1: ЛОББИ (Карточки) */
        .lobby-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
        .game-title { color: #fff; font-size: 20px; font-weight: 800; text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); text-transform: uppercase; margin-bottom: 20px; }
        .players-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 400px; }
        .player-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .avatar { width: 40px; height: 40px; margin: 0 auto 5px auto; border-radius: 12px; background: #1a1a24; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .role { font-size: 9px; color: #888; text-transform: uppercase; }
        .name { font-size: 12px; font-weight: bold; }

        /* ЭКРАН 2: ЧАТ */
        .chat-screen { display: none; flex-direction: column; height: 100%; }
        .chat-screen.active { display: flex; }
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px; }
        
        .message-bubble { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 12px; line-height: 1.4; animation: popIn 0.3s ease; }
        .message-bubble.left { align-self: flex-start; background: #1a1a24; border-bottom-left-radius: 4px; }
        .message-bubble.right { align-self: flex-end; background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; border-bottom-right-radius: 4px; font-weight: 600; }
        .message-system { align-self: center; text-align: center; font-size: 10px; color: #888; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 10px; margin: 5px 0; }
        
        @keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .chat-input-area { display: flex; gap: 8px; margin-top: 10px; }
        .chat-input-area input { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid #333; background: #1a1a24; color: #fff; font-family: 'Unbounded', sans-serif; font-size: 12px; outline: none; }
        .chat-input-area button { width: 50px; border-radius: 12px; background: #ffd700; color: #000; font-size: 18px; border: none; cursor: pointer; }

        /* ЭКРАН ВЕРДИКТА (Плавный как iOS) */
        .verdict-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            display: flex; align-items: flex-end; justify-content: center;
            z-index: 100; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .verdict-overlay.active { transform: translateY(0); }
        .verdict-panel {
            background: #121218; width: 100%; border-top-left-radius: 30px; border-top-right-radius: 30px;
            padding: 25px; box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }
        .verdict-panel h3 { margin: 0 0 15px 0; color: #ffd700; font-size: 16px; text-align: center; }
        .verdict-panel textarea { width: 100%; height: 100px; padding: 15px; border-radius: 16px; border: 1px solid #333; background: #1a1a24; color: #fff; font-family: 'Unbounded', sans-serif; font-size: 12px; resize: none; outline: none; margin-bottom: 15px; }
        .verdict-btns { display: flex; gap: 10px; }
        .verdict-btns button { flex: 1; padding: 16px; border-radius: 16px; border: none; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 12px; color: #fff; cursor: pointer; }
        .btn-guilty { background: linear-gradient(135deg, #ff0f7b, #f89b29); }
        .btn-not { background: linear-gradient(135deg, #00c6ff, #0072ff); }
    </style>
</head>
<body>
    <canvas id="particles-js"></canvas>
    
    <div class="content">
        <!-- ЭКРАН ЛОББИ -->
        <div class="lobby-screen" id="screen-lobby">
            <div class="game-title">Зал Суда</div>
            <div class="players-grid">
                <div class="player-card"><div class="avatar">👨‍⚖️</div><div class="role">Прокурор</div><div class="name" id="name-prokuror">Иван</div></div>
                <div class="player-card"><div class="avatar">🙋‍♂️</div><div class="role">Истец</div><div class="name" id="name-istets">Ты</div></div>
                <div class="player-card"><div class="avatar">🤷‍♂️</div><div class="role">Ответчик</div><div class="name" id="name-otvetchik">Петр</div></div>
                <div class="player-card"><div class="avatar">🛡️</div><div class="role">Адвокат</div><div class="name" id="name-advokat">Анна</div></div>
            </div>
        </div>

        <!-- ЭКРАН ЧАТА -->
        <div class="chat-screen" id="screen-chat">
            <div class="chat-messages" id="chat-messages">
                <!-- Сюда будут падать сообщения -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Твой аргумент...">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <!-- ПАНЕЛЬ ВЕРДИКТА (Скрыта по умолчанию) -->
    <div class="verdict-overlay" id="verdict-overlay">
        <div class="verdict-panel">
            <h3>Вынесение вердикта</h3>
            <textarea id="verdict-text" placeholder="Напиши текст решения суда..."></textarea>
            <div class="verdict-btns">
                <button class="btn-guilty" onclick="sendVerdict('guilty')">✅ Виновен</button>
                <button class="btn-not" onclick="sendVerdict('not_guilty')">❌ Не виновен</button>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); tg.setHeaderColor('#050505'); tg.setBackgroundColor('#050505');

        let myRole = "Прокурор"; // В реальности придет от бота

        // --- 1. ЛОГИКА ЧАТА ---
        function addMessage(text, type, sender = "") {
            let box = document.getElementById('chat-messages');
            let div = document.createElement('div');
            
            if (type === 'system') {
                div.className = 'message-system';
                div.innerText = text;
            } else {
                div.className = `message-bubble ${type === 'my' ? 'right' : 'left'}`;
                if (sender) {
                    let nameSpan = document.createElement('div');
                    nameSpan.style.fontSize = '9px';
                    nameSpan.style.marginBottom = '3px';
                    nameSpan.style.opacity = '0.7';
                    nameSpan.innerText = sender;
                    div.appendChild(nameSpan);
                }
                div.appendChild(document.createTextNode(text));
            }
            
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function sendMessage() {
            let input = document.getElementById('chat-input');
            if (input.value.trim() === '') return;
            
            // Добавляем наше сообщение
            addMessage(input.value, 'my', 'Ты');
            
            // Отправляем боту
            tg.sendData(JSON.stringify({ action: 'chat_message', text: input.value, role: myRole }));
            input.value = '';
        }

        // --- 2. ПЕРЕХОД В ЧАТ (Имитация начала игры) ---
        setTimeout(() => {
            document.getElementById('screen-lobby').style.display = 'none';
            document.getElementById('screen-chat').classList.add('active');
            
            addMessage("⚖️ Суд начался. Дело: Кража печенья", "system");
            addMessage("🔊 Слово предоставляется Прокурору. Озвучьте дело.", "system");
        }, 1500);

        // --- 3. ВЕРДИКТ СУДЬИ ---
        function showVerdictPanel() {
            document.getElementById('verdict-overlay').classList.add('active');
        }

        function sendVerdict(type) {
            let text = document.getElementById('verdict-text').value;
            if (text.trim() === '') return alert('Напиши текст решения!');
            
            // Отправляем боту
            tg.sendData(JSON.stringify({ action: 'verdict', type: type, text: text }));
            
            // Закрываем панель
            document.getElementById('verdict-overlay').classList.remove('active');
            
            // Пишем в чат результат
            addMessage(`Решение суда: ${text}`, "my", "Судья");
            addMessage(type === 'guilty' ? "✅ ВИНОВЕН" : "❌ НЕ ВИНОВЕН", "system");
        }

        // --- 4. АНИМИРОВАННЫЙ ФОН ---
        const canvas = document.getElementById('particles-js'); const ctx = canvas.getContext('2d'); let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        class Particle { constructor() { this.reset(); } reset() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2 + 0.5; this.speedX = Math.random() * 0.5 - 0.25; this.speedY = Math.random() * 0.5 - 0.25; this.opacity = Math.random() * 0.5 + 0.1; } update() { this.x += this.speedX; this.y += this.speedY; if (this.x > canvas.width) this.x = 0; if (this.x < 0) this.x = canvas.width; if (this.y > canvas.height) this.y = 0; if (this.y < 0) this.y = canvas.height; } draw() { ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); } }
        for (let i = 0; i < 100; i++) particles.push(new Particle());
        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); } animate();
    </script>
</body>
</html>
